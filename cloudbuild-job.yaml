options:
  logging: CLOUD_LOGGING_ONLY

steps:
# Initialize and fetch git submodules recursively
- name: 'gcr.io/cloud-builders/git'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      git config --global --add safe.directory /workspace
      git submodule update --init --recursive
  id: Initialize git submodules

# Pull the cached image from Artifact Registry (with fallback for first build)
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args: ['-c', 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs:latest || exit 0']
  id: Pulling cached image

# Download FLUX model weights from GCS bucket into workspace for container baking
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      mkdir -p flux_blobs
      if [ "${_BAKE_FLUX:-true}" = "true" ]; then
        echo "=== Downloading FLUX weights from GCS to bake into Docker image ==="
        gcloud storage cp -r "gs://${_BUCKET_NAME}/hf_cache/blobs/*" flux_blobs/ || gsutil -m cp -r "gs://${_BUCKET_NAME}/hf_cache/blobs/*" flux_blobs/ || true
        echo "Staged $(ls flux_blobs | wc -l) blobs for Docker image baking"
      else
        echo "=== Skipping FLUX baking (_BAKE_FLUX=${_BAKE_FLUX}) ==="
      fi
  id: Download FLUX weights

# Build the training job image (multi-stage: CUDA kernels compiled in builder stage)
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs/$BRANCH_NAME:${COMMIT_SHA}',
    '--cache-from', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs:latest',
    '-f', 'Dockerfile',
    '.'
  ]
  id: Building the container image
  timeout: '5400s'

# Tag the image as latest for future caching
- name: 'gcr.io/cloud-builders/docker'
  args: ['tag', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs/$BRANCH_NAME:${COMMIT_SHA}', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs:latest']
  id: Tagging as latest

# Push the versioned image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs/$BRANCH_NAME:${COMMIT_SHA}']
  id: Pushing the image to registry
  timeout: '3600s'

# Push latest tag
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs:latest']
  id: Pushing latest tag
  timeout: '3600s'

# Deploy / update Cloud Run Job
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      if gcloud run jobs describe ${_JOB_NAME} --region=us-central1 --project=$PROJECT_ID > /dev/null 2>&1; then
        echo "Updating Cloud Run Job: ${_JOB_NAME}"
        gcloud run jobs update ${_JOB_NAME} \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs/$BRANCH_NAME:${COMMIT_SHA} \
          --region=us-central1
      else
        echo "Creating Cloud Run Job: ${_JOB_NAME}"
        gcloud run jobs create ${_JOB_NAME} \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs/$BRANCH_NAME:${COMMIT_SHA} \
          --region=us-central1
      fi
  id: Deploy Cloud Run Job

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs/$BRANCH_NAME:${COMMIT_SHA}'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/propvrtwt/skyfall-gs:latest'
